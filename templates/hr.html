<!DOCTYPE html>
<html>

<head>

    <title>HR Interview</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <h1>🤝 AI Interview System</h1>

    <div class="question-card">

        <h2>HR Interview</h2>

        <p>
            Question {{ question_number }} of 5
        </p>

        <h3>
            {{ question }}
        </h3>

        <form action="/submit-hr-answer" method="POST">

            <textarea
                name="answer"
                rows="8"
                placeholder="Type your answer here..."
                required
            ></textarea>

            <br><br>

            <button type="submit">
                Submit Answer
            </button>

        </form>

    </div>

</body>

</html>
